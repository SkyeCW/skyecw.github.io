<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>SkyeCW 的笔记</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" id="theme-light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/dark.css" id="theme-dark" disabled>
  <style>
    /* 调整正文宽度 */
    .markdown-section { max-width: 900px !important; }
    /* 如果你喜欢全宽，用下面这行替换上面那行： */
    /* .markdown-section { max-width: 90% !important; } */

    /* 亮/暗主题切换按钮 */
    .theme-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .06);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .theme-toggle:hover { background: rgba(0, 0, 0, .12); }
    html[data-theme="dark"] .theme-toggle { background: rgba(255, 255, 255, .12); }
    html[data-theme="dark"] .theme-toggle:hover { background: rgba(255, 255, 255, .24); }

    /* 暗色主题加深：覆盖 docsify dark.css 默认的 #3f3f3f 灰底 */
    html[data-theme="dark"] {
      --dark-bg: #000;          /* 页面底色，想再浅一点可改成 #0a0a0a */
      --dark-panel: #0a0a0a;    /* 侧边栏 */
      --dark-code: #141414;     /* 代码块 */
      --dark-border: #262626;   /* 分割线、表格边框 */
      --dark-text: #e8e8e8;     /* 正文 */
    }
    html[data-theme="dark"],
    html[data-theme="dark"] body { background-color: var(--dark-bg); color: var(--dark-text); }
    html[data-theme="dark"] .sidebar {
      background-color: var(--dark-panel);
      color: var(--dark-text);
      border-right-color: var(--dark-border);
    }
    html[data-theme="dark"] .sidebar ul li a { color: #d0d0d0; }
    html[data-theme="dark"] .sidebar ul li.active > a { color: #ff8a72; }
    html[data-theme="dark"] .sidebar-toggle { background-color: rgba(10, 10, 10, .85); }
    html[data-theme="dark"] .github-corner svg { color: var(--dark-panel); }

    html[data-theme="dark"] .anchor span,
    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h2,
    html[data-theme="dark"] .markdown-section h3,
    html[data-theme="dark"] .markdown-section h4,
    html[data-theme="dark"] .markdown-section strong { color: #f5f5f5; }
    html[data-theme="dark"] .markdown-section h5,
    html[data-theme="dark"] .markdown-section h6 { color: #d8d8d8; }
    html[data-theme="dark"] .markdown-section blockquote { color: #a8a8a8; }
    html[data-theme="dark"] .markdown-section em { color: #b9c2c7; }
    html[data-theme="dark"] .markdown-section hr { border-bottom-color: var(--dark-border); }
    html[data-theme="dark"] .markdown-section td,
    html[data-theme="dark"] .markdown-section th { border-color: var(--dark-border); }
    html[data-theme="dark"] .markdown-section tr { border-top-color: var(--dark-border); }
    html[data-theme="dark"] .markdown-section tr:nth-child(2n) { background-color: #101010; }

    html[data-theme="dark"] .markdown-section code {
      background-color: var(--dark-code);
      color: var(--dark-text);
    }
    html[data-theme="dark"] .markdown-section pre { background-color: var(--dark-code); }
    html[data-theme="dark"] .markdown-section pre > code { color: var(--dark-text); }
    html[data-theme="dark"] pre:after { color: #8a8a8a; }
    html[data-theme="dark"] .markdown-section p.tip {
      background-color: var(--dark-code);
      color: var(--dark-text);
    }
    html[data-theme="dark"] .markdown-section p.tip:before { color: var(--dark-bg); }
    html[data-theme="dark"] .markdown-section p.tip code { background-color: #1f1f1f; }
    html[data-theme="dark"] .markdown-section p.warn { background: rgba(234, 111, 90, .14); }
    html[data-theme="dark"] input[type=search] {
      background: #1a1a1a;
      border-color: #303030;
      color: var(--dark-text);
    }
  </style>
  <script>
    // 首屏渲染前应用主题，避免亮色闪一下
    (function () {
      var saved = localStorage.getItem('docsify-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('theme-dark').disabled = !dark;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <button id="theme-toggle" class="theme-toggle" type="button">🌙</button>

  <script>
    window.$docsify = {
      name: 'SkyeCW 的笔记',
      repo: 'https://github.com/SkyeCW/skyecw.github.io',
      loadSidebar: true,    // 开启侧边栏
      subMaxLevel: 3,       // 显示三级目录
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var darkCss = document.getElementById('theme-dark');

      function apply(dark, persist) {
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        darkCss.disabled = !dark;
        btn.textContent = dark ? '☀️' : '🌙';
        btn.title = dark ? '切换到亮色主题' : '切换到暗色主题';
        btn.setAttribute('aria-label', btn.title);
        if (persist) localStorage.setItem('docsify-theme', dark ? 'dark' : 'light');
      }

      // 主题已在 head 中应用，这里只同步按钮状态
      apply(document.documentElement.getAttribute('data-theme') === 'dark', false);

      btn.addEventListener('click', function () {
        apply(document.documentElement.getAttribute('data-theme') !== 'dark', true);
      });

      // 用户没有手动选择时，跟随系统主题变化
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('docsify-theme')) apply(e.matches, false);
      });
    })();
  </script>
</body>
</html>
